name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The storage contract suite also runs against a real PostgreSQL (backend/storage/sql/postgres.test.ts).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # An S3-compatible store for the image store's tests (backend/storage/images/s3.test.ts), which checks the request signatures.
      # Started here and not as a service, because it needs arguments. Any answer, a 403 included, means it is up.
      - run: |
          docker run -d --name s3 -p 7070:7070 -e ROOT_ACCESS_KEY=notefeed -e ROOT_SECRET_KEY=notefeed-secret versity/versitygw:v1.8.0 posix /tmp
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:7070 && exit 0; sleep 1; done
          docker logs s3; exit 1
      # A dev OpenBao for the key service's tests (backend/storage/openbao.test.ts and the encrypted storage tests), root token "root".
      - run: |
          docker run -d --name bao -p 8200:8200 -e BAO_DEV_ROOT_TOKEN_ID=root openbao/openbao:2.7.0 server -dev -dev-listen-address=0.0.0.0:8200
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8200/v1/sys/health && exit 0; sleep 1; done
          docker logs bao; exit 1
      - run: npm test
        env:
          NOTEFEED_TEST_POSTGRES_URL: postgres://postgres:pw@localhost:5432/postgres
          NOTEFEED_TEST_S3_ENDPOINT: http://localhost:7070
          NOTEFEED_TEST_S3_ACCESS_KEY: notefeed
          NOTEFEED_TEST_S3_SECRET_KEY: notefeed-secret
          NOTEFEED_TEST_OPENBAO_ADDR: http://localhost:8200
          NOTEFEED_TEST_OPENBAO_TOKEN: root

  # The committed openapi.json and the clients generated from it must match the route table.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run generate
      # --porcelain also catches files the generators added that aren't committed yet.
      - name: Generated files are current
        run: test -z "$(git status --porcelain)" || { git status --short; echo "::error::Generated files are stale. Run npm run generate and commit."; exit 1; }
      - run: npx -y @redocly/cli@2.57.0 lint openapi.json

  e2e:
    runs-on: ubuntu-latest
    # Normally 3–4 minutes: fail a hung run instead of holding the required checks.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # On the runner, which has the compiler better-sqlite3 needs (it has no prebuilt binaries); the image has none.
      - run: npm ci
      # In Playwright's image, which has the browsers and their system libraries, at the version package-lock.json has:
      # `playwright install --with-deps` fetched 119 MB from the Ubuntu mirror on every run, and on some runners that
      # took half an hour (issue #289). The image is Ubuntu 24.04 like the runner, so the modules npm ci built work in it;
      # the runner's Node 22 is mounted, the image's own is 24. --ipc=host: Chromium needs more than Docker's /dev/shm.
      - name: Run npm run test:e2e in Playwright's image
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          docker run --rm --ipc=host --user "$(id -u):$(id -g)" -e CI -e HOME=/tmp \
            -v "$PWD:/w" -w /w -v "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro" \
            "mcr.microsoft.com/playwright:v$version-noble" sh -c 'PATH=/opt/node/bin:$PATH npm run test:e2e'
      # Kept for a run that passed too: a test that failed once and passed on its retry leaves its trace only here.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.event_name }}
          path: playwright-report/
          retention-days: 14

  # The image has no shell (docs/adr/0028), so its entrypoint and health check are Node code that only a running container exercises.
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: notefeed:smoke
          cache-from: type=gha
      - name: Starts on the runner's folder, turns healthy and writes notes as the folder's owner
        run: |
          mkdir data
          docker run -d --name notefeed -p 3000:3000 -v "$PWD/data:/data" notefeed:smoke
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' notefeed)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' notefeed | grep -qx healthy || { docker logs notefeed; exit 1; }
          curl -fsS -H 'Content-Type: text/markdown' --data-binary 'smoke' http://localhost:3000/smoke-feed-4f9c2a7e1b
          owner=$(stat -c %u data/smoke-feed-4f9c2a7e1b/*.md)
          [ "$owner" = "$(id -u)" ] || { echo "::error::the note belongs to uid $owner, not $(id -u)"; exit 1; }

  # Main pushes build :main + :latest; vX.Y.Z tags build :X.Y.Z/:X.Y/:X + :latest and a
  # GitHub release (same scheme as the MCP repos). The client packages release from the
  # same tags in clients.yml.
  image:
    needs: [check, image-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Derived from the repository so an account rename doesn't break the push.
      - run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # branch push -> :main (+ :latest via the raw rule); v* tag -> semver tags + :latest (latest=auto)
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attached to the image in the registry (docs/self-hosting/security.md shows how to read them).
          sbom: true
          provenance: mode=max
      # The SBOM files of a release (CycloneDX). Written on main too, so a broken step shows before a tag needs it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: SBOM of the npm dependencies
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="0.0.0-main.sha${GITHUB_SHA::7}" ;;
          esac
          echo "SBOM_VERSION=$version" >> "$GITHUB_ENV"
          mkdir sbom
          # The root package is private and stays at 0.1.0: the SBOM gets the version it describes.
          npm version "$version" --no-git-tag-version --allow-same-version
          # What package-lock.json resolves, without the packages only tests and the build use.
          npm sbom --package-lock-only --omit dev --sbom-format cyclonedx > "sbom/notefeed-$version-npm.cdx.json"
      # What is in the pushed image (linux/amd64), Alpine packages included.
      - name: SBOM of the image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom/notefeed-${{ env.SBOM_VERSION }}-image.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  # Tag a commit (git tag -a vX.Y.Z) to publish a GitHub release. The notes are the annotated
  # tag message, GitHub's generated "What's Changed" (the pull requests merged since the
  # previous release) and a fixed install section. The SBOM files the image job wrote are
  # attached. Re-runs update the release in place.
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Assemble release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # checkout leaves the tag pointing at the commit, even an annotated one: fetch the tag itself.
          git fetch -q --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # Annotated tag message only: for a lightweight tag, %(contents) would be the commit message.
          if [ "$(git cat-file -t "refs/tags/$TAG")" = tag ]; then
            git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md
          else
            : > notes.md
          fi
          [ -s notes.md ] && printf '\n' >> notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -q .body >> notes.md
          printf '\n---\n\n' >> notes.md
          cat >> notes.md <<'EOF'
          ## Install

          ```yaml
          # compose.yaml
          services:
            notefeed:
              image: ghcr.io/notefeed/notefeed:__VERSION__
              restart: unless-stopped
              ports:
                - "3000:3000"
              environment:
                # PUBLIC_URL: https://notes.example.com
                # NOTEFEED_PASSWORD: <openssl rand -hex 32>   # optional: lock posting and the web UI
              volumes:
                - ./data:/data
          ```

          ```bash
          mkdir data   # notes are written as the owner of this folder
          docker compose up -d
          ```

          Then open http://localhost:3000 and pick a hard-to-guess feed name.

          Client packages at this version: `pip install notefeed==__VERSION__` · `npm install notefeed@__VERSION__`

          Documentation: https://docs.notefeed.me/

          SBOM (CycloneDX): the two `.cdx.json` files attached to this release. See [Security fixes and SBOM](https://docs.notefeed.me/self-hosting/security/).
          EOF
          # The git tag keeps its v (v0.1.1); image and package versions drop it (0.1.1).
          sed -i "s|__VERSION__|${TAG#v}|g" notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom
      - name: Attach the SBOM files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" sbom/*.cdx.json --clobber
      # One note per release on notefeed.me's reserved `releases` feed (https://notefeed.me/r/releases):
      # the tag message without its first line, under a line with the date and the GitHub release.
      # A re-run finds the note by its tag and posts nothing; without the secret (a fork) it is skipped.
      - name: Post to the releases feed
        env:
          PASSWORD: ${{ secrets.NOTEFEED_RESERVED_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$PASSWORD" ]; then echo "::notice::NOTEFEED_RESERVED_PASSWORD is not set: not posted"; exit 0; fi
          found=$(curl -sf "https://notefeed.me/api/v1/read/releases/notes?tag=$TAG")
          if [ "$(jq '.notes | length' <<< "$found")" != 0 ]; then echo "already posted"; exit 0; fi
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '1{/^notefeed /d}' | sed '/./,$!d' > post.md
          printf '*Released %s · [on GitHub](https://github.com/%s/releases/tag/%s)*\n\n' "$(date -u +%F)" "$GITHUB_REPOSITORY" "$TAG" | cat - post.md > post-dated.md
          curl -sf -X POST https://notefeed.me/api/v1/feeds/releases/notes -H "Content-Type: text/markdown" \
            -H "X-Feed-Password: $PASSWORD" -H "X-Note-Title: notefeed ${TAG#v}" -H "X-Note-Tags: release,$TAG" \
            --data-binary @post-dated.md -o /dev/null -w "posted: %{http_code}\n"
      # A short post about the release on the reserved `news` feed (https://notefeed.me/r/news), written by Claude from the
      # tag message and the release's pull requests: only what users notice, no post when there is nothing of the kind.
      # The release is out either way, so a failure here is a warning, not a failed release.
      - name: Post to the news
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTEFEED_RESERVED_PASSWORD: ${{ secrets.NOTEFEED_RESERVED_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$NOTEFEED_RESERVED_PASSWORD" ]; then echo "::notice::a secret is not set: no news post"; exit 0; fi
          scripts/release-news.sh "$TAG"

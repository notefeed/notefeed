name: Audit

# Known vulnerabilities in what is shipped: the server's and the client packages' dependencies, and the published image.
# A scheduled run, because an advisory appears without a commit. A red run means: upgrade the dependency, or release again so the
# image is rebuilt on a fixed base.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/audit.yml]

permissions:
  contents: read

jobs:
  # Production dependencies only: what the tests and the build need is not in the image or the package.
  npm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [., packages/js]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The locked versions, without the test extra and the package itself.
      - run: uv export -q --locked --no-dev --no-emit-project --no-hashes -o requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  # The image people run, Alpine packages included. Only findings that have a fix: the others cannot be acted on.
  image:
    runs-on: ubuntu-latest
    steps:
      # Derived from the repository so an account rename doesn't break the scan.
      - run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: anchore/scan-action@v7
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  # The M8ven trust index (https://m8ven.ai/mcp/notefeed/notefeed), which MCP directories show next to the server. Its grade is capped
  # at C for new projects until they have adoption, so the gate is the code sub-score, the part our code decides; the summary has
  # the rest. M8ven re-reads the repository about once a day.
  m8ven:
    runs-on: ubuntu-latest
    env:
      MIN_CODE_SCORE: 80
    steps:
      - run: |
          r=$(curl -sf --retry 3 "https://m8ven.ai/api/mcp/score?url=https%3A%2F%2Fgithub.com%2F${GITHUB_REPOSITORY/\//%2F}")
          jq -r '"### M8ven: \(.grade) \(.score)/100, code \(.sub_scores.code)\n\nChecks: \(.findings_summary.pass) passed, \(.findings_summary.warn) warnings, \(.findings_summary.fail) failed (commit \(.commit_sha[:7]), read \(.verified_at[:10])). Details: https://m8ven.ai/mcp/notefeed/notefeed"' <<<"$r" | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(jq '.sub_scores.code' <<<"$r")
          if [ "$code" -lt "$MIN_CODE_SCORE" ]; then echo "::error::M8ven code score $code is below $MIN_CODE_SCORE"; exit 1; fi

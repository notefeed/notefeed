# Dependency bumps as pull requests with CI run, merged by hand (CLAUDE.md). Security updates (switched on in the repository's
# settings) come at once and skip the cooldown; everything else waits two weeks after a release and comes grouped on Monday mornings.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    ignore:
      # @types/node follows the Node major the app runs on (.nvmrc, the Dockerfile), by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      # Next.js and its ESLint config move together.
      nextjs:
        patterns: [next, eslint-config-next, "@next/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /packages/js
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    ignore:
      # @types/node follows the oldest Node the client supports (engines in packages/js/package.json), by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /packages/python
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    ignore:
      # The Node major follows .nvmrc and the Dockerfile together, by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

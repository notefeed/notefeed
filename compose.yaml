services:
  notefeed:
    image: ghcr.io/notefeed/notefeed:latest # or pin a release, e.g. :0.35
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Every setting is in .env: copy .env.example to .env and change what you need. An unchanged copy runs the defaults.
    env_file: .env
    volumes:
      - notefeed-data:/data

volumes:
  notefeed-data:
